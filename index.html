<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Jeropoints - Asamblea Jerovia</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Montserrat:wght@300;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --rosa-principal: #f8bbd0;
    --rosa-fuerte: #e91e63;
    --dorado: #dfaf37; --plata: #9e9e9e; --bronce: #cd7f32;
    --arcoiris-oficial: linear-gradient(90deg, #ffadad, #ffd6a5, #fdffb6, #caffbf, #9bf6ff, #a0c4ff, #bdb2ff);
  }

  body { 
    font-family: 'Montserrat', sans-serif; 
    background: #fffafb; 
    color: #444; 
    margin: 0; 
    min-height: 100vh; 
    padding-bottom: 120px;
  }
  
  header { 
    background: white; 
    padding: 25px; 
    text-align: center; 
    border-bottom: 5px solid transparent; 
    border-image: var(--arcoiris-oficial) 1;
    box-shadow: 0 4px 15px rgba(0,0,0,0.03);
  }
  
  h1 { font-family: 'Playfair Display', serif; font-size: 2.2rem; color: var(--rosa-fuerte); margin: 0; letter-spacing: 1px; }

  /* Podio Adaptable y Clickeable */
  .podium-container { 
    display: flex; justify-content: center; align-items: flex-end; 
    gap: 8px; margin: 30px auto; height: 240px; max-width: 500px; padding: 0 10px; 
  }
  .podium-step { 
    flex: 1; display: flex; flex-direction: column; align-items: center; 
    cursor: pointer; transition: transform 0.2s; 
  }
  .podium-step:hover { transform: scale(1.05); }
  .podium-bar { 
    width: 100%; border-radius: 12px 12px 0 0; display: flex; flex-direction: column; 
    justify-content: center; align-items: center; color: white; font-weight: bold; 
    box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
  }
  
  .step-1 { height: 140px; background: var(--dorado); order: 2; }
  .step-2 { height: 100px; background: var(--plata); order: 1; }
  .step-3 { height: 75px; background: var(--bronce); order: 3; }
  
  .podium-name { font-family: 'Playfair Display', serif; font-weight: bold; margin-bottom: 5px; font-size: 0.9rem; color: #333; text-align: center; }
  .avatar { 
    width: 55px; height: 55px; border-radius: 50%; background: white; 
    margin-bottom: -10px; z-index: 2; border: 3px solid white; 
    box-shadow: 0 4px 8px rgba(0,0,0,0.1); object-fit: cover; 
  }

  /* Lista de Ranking */
  .ranking-list { max-width: 600px; margin: 0 auto; padding: 15px; }
  .sister-card { 
    background: white; margin-bottom: 10px; padding: 12px 20px; border-radius: 50px; 
    display: flex; justify-content: space-between; align-items: center; 
    cursor: pointer; transition: 0.3s; border: 1px solid #f0f0f0; 
  }
  .sister-card:hover { transform: scale(1.02); background: var(--rosa-principal); color: white; }

  /* BOTONES INFERIORES */
  .footer-btns {
    position: fixed; bottom: 20px; left: 0; width: 100%;
    display: flex; justify-content: center; gap: 8px;
    padding: 0 10px; box-sizing: border-box; z-index: 100;
  }
  .btn-fixed {
    flex: 1; max-width: 140px; padding: 12px 5px; border-radius: 20px;
    font-family: 'Montserrat', sans-serif; font-weight: 700; cursor: pointer;
    box-shadow: 0 4px 15px rgba(0,0,0,0.15); border: none; font-size: 0.75rem;
    color: white; transition: 0.3s; text-align: center; line-height: 1.2;
  }
  .btn-earn { background: #4caf50; }
  .btn-hist { background: var(--rosa-fuerte); }
  .btn-lose { background: #f44336; }

  /* Modales */
  .modal-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(5px); display: flex; justify-content: center; align-items: center; z-index: 1000; }
  .modal-content { background: white; padding: 30px; border-radius: 25px; width: 85%; max-width: 380px; text-align: center; position: relative; }
  
  .close-x { position: absolute; top: 15px; right: 20px; font-size: 1.5rem; color: #ccc; cursor: pointer; }
  .detail-container { max-height: 400px; overflow-y: auto; margin-top: 15px; padding-right: 5px; }

  /* Timeline General */
  .timeline { position: relative; padding-left: 30px; margin: 20px 0; text-align: left; }
  .timeline::before { content: ''; position: absolute; left: 10px; top: 0; width: 3px; height: 100%; background: var(--rosa-principal); border-radius: 5px; }
  .timeline-item { position: relative; margin-bottom: 25px; }
  .timeline-dot { position: absolute; left: -27px; top: 5px; width: 14px; height: 14px; background: white; border: 3px solid var(--rosa-fuerte); border-radius: 50%; z-index: 2; }
  .timeline-date { font-size: 0.7rem; font-weight: 700; color: #b3b3b3; margin-bottom: 5px; display: block; }
  
  .timeline-content {
    background: #fff; padding: 12px; border-radius: 15px; border: 1px solid #f0f0f0;
    box-shadow: 0 3px 10px rgba(0,0,0,0.02); display: flex; justify-content: space-between; align-items: center;
    cursor: pointer; transition: 0.2s;
  }
  .timeline-content:hover { background: #fffafb; border-color: var(--rosa-principal); }
  .timeline-motivo { font-size: 0.85rem; color: #555; font-weight: 500; flex: 1; padding-right: 10px; }
  .timeline-pts { font-weight: 700; font-size: 0.95rem; }

  /* Botón de WhatsApp */
  .reclamo-box {
    margin-top: 8px; display: none; text-align: right;
    animation: slideDown 0.3s ease-out forwards;
  }
  .reclamo-box.show { display: block; }
  .btn-whatsapp-mini {
    display: inline-block; background: #25D366; color: white; text-decoration: none;
    padding: 8px 15px; border-radius: 15px; font-weight: 600; font-size: 0.75rem;
    box-shadow: 0 4px 8px rgba(37, 211, 102, 0.3); transition: 0.2s;
  }
  .btn-whatsapp-mini:hover { background: #128C7E; transform: scale(1.03); }

  @keyframes slideDown {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
  }

  /* Reglas */
  .lista-reglas { list-style: none; padding: 0; margin: 0; }
  .item-regla { display: flex; justify-content: space-between; align-items: center; background: #f9f9f9; margin-bottom: 12px; padding: 15px 15px; border-radius: 15px; transition: transform 0.2s; border: 1px solid #eee; }
  .item-regla:hover { transform: scale(1.02); background: #fff; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
  .regla-texto { font-family: 'Montserrat', sans-serif; font-size: 0.85rem; color: #444; text-align: left; flex: 1; padding-right: 10px; line-height: 1.3; font-weight: 500; }
  .badge-pos { font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 0.9rem; background: #e8f5e9; color: #2e7d32; padding: 6px 12px; border-radius: 10px; white-space: nowrap; }
  .badge-neg { font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 0.9rem; background: #ffebee; color: #c62828; padding: 6px 12px; border-radius: 10px; white-space: nowrap; }

  .hidden { display: none !important; }
  .loading { text-align: center; padding: 100px; color: var(--rosa-fuerte); }
</style>
</head>
<body>

<header>
  <h1>Jeropoints</h1>
</header>

<main id="mainContent">
  <div class="loading">✨ Abriendo el Libro de Puntos... ✨</div>
</main>

<div class="footer-btns">
  <button class="btn-fixed btn-earn" onclick="openRules('earn')">Cómo ganar</button>
  <button class="btn-fixed btn-hist" onclick="openGlobalHistory()">Historial Asignados</button>
  <button class="btn-fixed btn-lose" onclick="openRules('lose')">Cómo perder</button>
</div>

<div id="rulesModal" class="modal-overlay hidden" onclick="this.classList.add('hidden')">
  <div class="modal-content" onclick="event.stopPropagation()">
    <span class="close-x" onclick="document.getElementById('rulesModal').classList.add('hidden')">&times;</span>
    <h2 id="rulesTitle" style="font-family: 'Playfair Display', serif; margin-bottom: 20px;"></h2>
    <div id="rulesList" class="detail-container"></div>
  </div>
</div>

<div id="historyModal" class="modal-overlay hidden" onclick="this.classList.add('hidden')">
  <div class="modal-content" style="max-width: 450px;" onclick="event.stopPropagation()">
    <span class="close-x" onclick="document.getElementById('historyModal').classList.add('hidden')">&times;</span>
    <h2 id="histTitle" style="font-family: 'Playfair Display', serif; color: var(--rosa-fuerte); margin-bottom: 15px;"></h2>
    <div id="histBody" class="detail-container"></div>
  </div>
</div>

<div id="globalHistoryModal" class="modal-overlay hidden" onclick="this.classList.add('hidden')">
  <div class="modal-content" style="max-width: 450px;" onclick="event.stopPropagation()">
    <span class="close-x" onclick="document.getElementById('globalHistoryModal').classList.add('hidden')">&times;</span>
    <h2 style="font-family: 'Playfair Display', serif; color: var(--rosa-fuerte); margin-bottom: 5px;">Puntos Asignados</h2>
    <p style="font-size: 0.8rem; color: #888; margin-top: 0;">Tocá un punto si no te lo sumaron</p>
    <div id="globalHistBody" class="detail-container"></div>
  </div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwbnRBGyL2Uo84GD6yB9kRwCTCrMMyJk4P9YCxgWKQdXPxwsPe4TlWKN_3Y-dgeNL2yoA/exec";
let sisters = [];
let realSisters = [];
let globalHistoryData = [];

async function init() {
    try {
        const r = await fetch(SCRIPT_URL);
        const rawData = await r.json();
        
        sisters = rawData.map(s => {
            // Saltamos las filas de configuracion (contraseña, foto, etc)
            const dSlices = s.detalles ? s.detalles.slice(4) : [];
            
            // EL FIX: Buscamos tanto "Puntos" como "puntos" para que sume correctamente
            const totalCalc = dSlices.reduce((acc, curr) => {
                const valorPuntos = curr.Puntos || curr.puntos || 0;
                const p = parseFloat(valorPuntos);
                return acc + (isNaN(p) ? 0 : p);
            }, 0);

            return {
                ...s,
                detalles: dSlices,
                totalPuntos: totalCalc
            };
        });
        
        const colPuntos = sisters.find(s => s.nombre && s.nombre.toLowerCase().includes('punto'));
        if (colPuntos) {
            globalHistoryData = colPuntos.detalles; 
        }

        realSisters = sisters.filter(s => s.nombre && !s.nombre.toLowerCase().includes('punto'));
        
        render();
    } catch(e) {
        console.error(e);
        document.getElementById('mainContent').innerHTML = "<p style='text-align:center; padding:50px;'>Error al conectar. Verifica la consola.</p>";
    }
}

function render() {
    const sorted = [...realSisters].sort((a,b) => b.totalPuntos - a.totalPuntos);
    const main = document.getElementById('mainContent');
    main.innerHTML = `<div class="podium-container" id="pod"></div><div class="ranking-list" id="list"></div>`;
    
    const pod = document.getElementById('pod');
    
    [1,0,2].forEach(idx => {
        const s = sorted[idx];
        if(!s) return;
        pod.innerHTML += `
            <div class="podium-step" onclick="showSisterHistory('${s.nombre}')">
                <div class="podium-name">${s.nombre}</div>
                <img src="${s.foto || 'https://ui-avatars.com/api/?name='+s.nombre+'&background=f8bbd0&color=fff'}" class="avatar">
                <div class="podium-bar step-${idx+1}"><span>${s.totalPuntos}</span><small>PTS</small></div>
            </div>`;
    });

    const list = document.getElementById('list');
    const hermanasRestantes = sorted.slice(3);
    
    hermanasRestantes.forEach((s, i) => {
        list.innerHTML += `
            <div class="sister-card" onclick="showSisterHistory('${s.nombre}')">
                <span><strong style="color:var(--rosa-fuerte)">${i + 4}.</strong> ${s.nombre}</span>
                <span style="font-weight:bold; color:var(--rosa-fuerte)">${s.totalPuntos} pts</span>
            </div>`;
    });
}

function showSisterHistory(n) {
    const activeSister = realSisters.find(s => s.nombre === n);
    const body = document.getElementById('histBody');
    document.getElementById('histTitle').innerText = activeSister.nombre;
    
    let h = `<div class="timeline">`;
    [...activeSister.detalles].reverse().forEach(d => {
        const pVal = parseFloat(d.Puntos || d.puntos || 0);
        const motivo = d.Motivo || d.motivo || 'Sin motivo';
        const fechaVal = d.Fecha || d.fecha;
        
        if (pVal === 0 && motivo === 'Sin motivo') return;

        const c = pVal >= 0 ? "#2e7d32" : "#c62828";
        const fechaSimple = fechaVal ? new Date(fechaVal).toLocaleDateString('es-ES', { day: 'numeric', month: 'short' }) : '---';
        
        h += `
            <div class="timeline-item">
                <div class="timeline-dot"></div>
                <span class="timeline-date">${fechaSimple}</span>
                <div class="timeline-content" style="cursor:default;">
                    <span class="timeline-motivo">${motivo}</span>
                    <span class="timeline-pts" style="color:${c}">${pVal > 0 ? '+':''}${pVal}</span>
                </div>
            </div>`;
    });
    h += `</div>`;
    
    body.innerHTML = activeSister.detalles.length === 0 ? `<p style="padding:20px; color:#999;">Sin registros.</p>` : h;
    document.getElementById('historyModal').classList.remove('hidden');
}

function openGlobalHistory() {
    const body = document.getElementById('globalHistBody');
    let h = `<div class="timeline">`;
    
    [...globalHistoryData].reverse().forEach((d, index) => {
        const pVal = parseFloat(d.Puntos || d.puntos || 0);
        const motivo = d.Motivo || d.motivo || 'Sin motivo';
        const fechaVal = d.Fecha || d.fecha;

        if (pVal === 0 && motivo === 'Sin motivo') return;

        const c = pVal >= 0 ? "#2e7d32" : "#c62828";
        const fechaSimple = fechaVal ? new Date(fechaVal).toLocaleDateString('es-ES', { day: 'numeric', month: 'short' }) : '---';
        
        const msjWhatsApp = encodeURIComponent(`¡Hola mi hermana! Quería avisar que no me sumaron mis Jeropoints correspondientes a: "${motivo}" de la fecha ${fechaSimple}.`);
        
        h += `
            <div class="timeline-item">
                <div class="timeline-dot"></div>
                <span class="timeline-date">${fechaSimple}</span>
                
                <div class="timeline-content" onclick="toggleReclamo(${index})">
                    <span class="timeline-motivo">${motivo}</span>
                    <span class="timeline-pts" style="color:${c}">${pVal > 0 ? '+':''}${pVal}</span>
                </div>
                
                <div id="reclamo-${index}" class="reclamo-box">
                    <a href="https://wa.me/+595981614237?text=${msjWhatsApp}" target="_blank" class="btn-whatsapp-mini">
                        ¡No me sumaron este punto! 📲
                    </a>
                </div>
            </div>`;
    });
    
    h += `</div>`;
    body.innerHTML = globalHistoryData.length === 0 ? `<p style="padding:20px; color:#999;">Sin puntos asignados.</p>` : h;
    document.getElementById('globalHistoryModal').classList.remove('hidden');
}

function toggleReclamo(index) {
    document.getElementById(`reclamo-${index}`).classList.toggle('show');
}

function openRules(t) {
    const isE = t === 'earn';
    document.getElementById('rulesTitle').innerText = isE ? "Cómo ganar puntos" : "Cómo perder puntos";
    document.getElementById('rulesTitle').style.color = isE ? "#2e7d32" : "#c62828";
    
    const rulesToRender = isE ? [
        { desc: "Destacar en trabajo", pts: "+ 5", colorBorde: "var(--rosa-principal)" },
        { desc: "Saber parlamento de memoria en una publica (largo)", pts: "+ 50", colorBorde: "var(--dorado)" },
        { desc: "Participar de las dinámicas", pts: "+ 10", colorBorde: "var(--rosa-fuerte)" },
        { desc: "Participar de una actividad de la gran logia", pts: "+ 10", colorBorde: "var(--rosa-fuerte)" },
        { desc: "Participar de una actividad realizada un día diferente a sábado", pts: "+ 10", colorBorde: "var(--rosa-fuerte)" }
    ] : [
        { desc: "Ausencia injustificada", pts: "- 10" },
        { desc: "No participar de una dinámica obligatoria", pts: "- 5" },
        { desc: "Interrumpir", pts: "- 5" }
    ];
    
    const badgeClass = isE ? "badge-pos" : "badge-neg";
    
    let htmlContent = `<div class="lista-reglas">`;
    rulesToRender.forEach(rule => {
        const borderStyle = isE ? `border-left: 5px solid ${rule.colorBorde};` : `border-left: 5px solid #c62828;`;
        htmlContent += `
            <div class="item-regla" style="${borderStyle}">
                <span class="regla-texto">${rule.desc}</span>
                <span class="${badgeClass}">${rule.pts}</span>
            </div>`;
    });
    htmlContent += `</div>`;
    
    document.getElementById('rulesList').innerHTML = htmlContent;
    document.getElementById('rulesModal').classList.remove('hidden');
}

init();
</script>
</body>
</html>
